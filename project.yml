name: Sideline
options:
  bundleIdPrefix: com.cpf32
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_MACCATALYST: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sideline:
    type: application
    platform: iOS
    sources:
      - path: Sideline
        excludes:
          - "**/*.md"
    resources:
      - path: Sideline/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cpf32.sideline
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        INFOPLIST_KEY_CFBundleDisplayName: Sideline
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_ENTITLEMENTS: Sideline/Sideline.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: Sideline/Sideline.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Sideline/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Sideline
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
schemes:
  Sideline:
    build:
      targets:
        Sideline: all
    run:
      config: Debug
    archive:
      config: Release
